name: Validar marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # el check de bump compara contra el merge-base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Instalar pyyaml (parser YAML real)
        run: pip install pyyaml
      - name: Validar plugins y frontmatters
        run: python scripts/validate.py
      - name: Self-test del verificador de artefactos
        run: python scripts/check-artifacts.py --self-test
      - name: Self-test de los scripts del repo
        run: |
          set -e
          for s in scripts/validate.py scripts/check-version-bump.py; do
            echo "== $s"; python "$s" --self-test
          done
      - name: Un plugin que cambia sube su version
        if: github.event_name == 'pull_request'
        run: python scripts/check-version-bump.py --base "origin/${{ github.base_ref }}"
      - name: Self-test de los scripts de la suite
        run: |
          set -e
          for s in $(grep -l -- '--self-test' plugins/*/skills/*/scripts/*.py | sort); do
            echo "== $s"; python "$s" --self-test
          done
