name: Validar marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Instalar pyyaml (parser YAML real)
        run: pip install pyyaml
      - name: Validar plugins y frontmatters
        run: python scripts/validate.py
      - name: Self-test del verificador de artefactos
        run: python scripts/check-artifacts.py --self-test
      - name: Self-test de los scripts del planning-pipeline
        run: |
          python plugins/planning-pipeline/skills/planning-pipeline/scripts/compute_execution_plan.py --self-test
          python plugins/planning-pipeline/skills/planning-pipeline/scripts/validate_plan.py --self-test
          python plugins/planning-pipeline/skills/planning-pipeline/scripts/slice_brief_context.py --self-test
