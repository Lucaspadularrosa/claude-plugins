name: Validar marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Instalar pyyaml (parser YAML real)
        run: pip install pyyaml
      - name: Validar plugins y frontmatters
        run: python scripts/validate.py
